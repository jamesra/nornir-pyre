# Headless unit tests for nornir-pyre.
# Runs pure-unit modules that do not require a Qt display or OpenGL context
# (GL shader compilation is deferred; imports succeed without an active context).
# Qt widget / VAO / shader integration tests are excluded.

name: Python application

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CURSES: "False"
  TERM: xterm
  NORNIR_HEADLESS: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install system GL/EGL libraries
      run: sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon-x11-0

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        python -m pip install pytest \
          "numpy>=1.26" "scipy>=1.11" "matplotlib>=3.8" \
          "Pillow>=10.2" "pydantic>=2.9.2" "six>=1.16" \
          "scikit-image>=0.25.1" "hypothesis>=6.96" \
          "PyOpenGL>=3.0" "PyYAML>=6.0.2" "rtree>=1.3" \
          "dependency-injector>=4.45.0"
        python -m pip install "PyQt6>=6.6.0" "PyQt6-sip>=13.6.0"
        python -m pip install "nornir_shared @ git+https://github.com/jamesra/nornir-shared.git@dev"
        python -m pip install "nornir_pools @ git+https://github.com/jamesra/nornir-pools.git@master" --no-deps
        python -m pip install "nornir_imageregistration @ git+https://github.com/jamesra/nornir-imageregistration.git@dev" --no-deps
        python -m pip install . --no-deps
        python -c "import pyre; import nornir_imageregistration; print('install ok')"

    - name: Create test output directory
      run: |
        mkdir -p "${{ github.workspace }}/testdata_output"
        echo "TESTOUTPUTPATH=${{ github.workspace }}/testdata_output" >> "$GITHUB_ENV"

    - name: Run headless unit tests
      run: >
        python -m pytest -q
        tests/test_pure_units.py
        tests/test_help_text.py
        tests/test_stos_manual_paths.py
        tests/test_async_stos_save.py
        tests/test_transform_edit_policy.py
        tests/test_control_point_space_mapping.py
        tests/test_composite_display_mesh.py
        tests/test_save_warped_image.py
        tests/test_rigid_stos_load.py
        tests/test_rotate_translate_warped_image.py
